services:
  voicecontext:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ../.env
    depends_on:
      - redis

  agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent
    stdin_open: true
    tty: true
    env_file:
      - ../.env

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
