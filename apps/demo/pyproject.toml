[project]
name = "voice-agent"
version = "0.1.0"
description = "VoiceContext simple voice agent demo"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.30.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "ipykernel>=6.29.0",
]
nemo = [
    "nemo_toolkit[asr]>=2.0.0",
    "soundfile>=0.12.0",
    "librosa>=0.10.0",
]
