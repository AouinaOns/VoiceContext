services:
  voicecontext:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - redis

  agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    stdin_open: true
    tty: true
    env_file:
      - .env

  notebook:
    build:
      context: .
      dockerfile: docker/Dockerfile.notebook
    ports:
      - "127.0.0.1:8888:8888"
    env_file:
      - .env
    volumes:
      # live-reload: edits in the host are reflected instantly
      - ./notebooks:/app/notebooks
      - ./apps/demo/src:/app/apps/demo/src

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  nemo-test:
    build:
      context: .
      dockerfile: docker/Dockerfile.nemo
    # Default: generates a synthetic tone (no audio file needed).
    # Override with: docker compose run nemo-test --file /audio/yourfile.wav
    command: ["--chunk-ms", "160"]
    volumes:
      # Mount a local folder so you can pass real audio files:
      #   mkdir audio && cp yourfile.wav audio/
      #   docker compose run nemo-test --file /audio/yourfile.wav
      - ./audio:/audio
    # GPU passthrough — Linux + nvidia-container-toolkit only.
    # Delete the deploy block when running on macOS (CPU fallback is used).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  redis-data:
