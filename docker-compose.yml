services:
  voicecontext:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - redis

  agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    stdin_open: true
    tty: true
    env_file:
      - .env

  notebook:
    build:
      context: .
      dockerfile: docker/Dockerfile.notebook
    ports:
      - "127.0.0.1:8888:8888"
    env_file:
      - .env
    volumes:
      # live-reload: edits in the host are reflected instantly
      - ./notebooks:/app/notebooks
      - ./apps/demo/src:/app/apps/demo/src

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
